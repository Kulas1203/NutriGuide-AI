name: nutriguide_ai
description: "NutriGuide AI — personalized nutrition, meal planning, food tracking, fasting, and an evidence-grounded AI Nutrition Coach."
publish_to: 'none'

# Versioning strategy: semantic version + monotonically increasing build number.
# See docs/RELEASE_CHECKLIST.md for the release process.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  dio: ^5.10.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  intl: ^0.20.2
  uuid: ^4.6.0
  fl_chart: ^1.2.0
  connectivity_plus: ^7.3.0
  flutter_secure_storage: ^10.3.1
  package_info_plus: ^10.2.1
  flutter_local_notifications: ^22.1.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/legal/
